[pytest]
# Seuls les fichiers tests/test_*.py sont des tests automatiques (sans appel au vrai LLM).
# Les scripts tests/manual_*.py appellent le vrai LLM et se lancent à la main.
testpaths = tests
python_files = test_*.py
addopts = -q
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
